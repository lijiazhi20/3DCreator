# ============================================================================
# 3DCreator — Android CI (CLOUD COMPILATION)
# ----------------------------------------------------------------------------
# This workflow runs on GitHub's cloud runners (ubuntu-latest). Every time it
# executes it COMPILES THE ANDROID APK IN THE CLOUD — i.e. the "cloud build" of
# the mobile client. NOTE: the 3D reconstruction itself runs on a SEPARATE GPU
# cloud (Modal / RunPod) and is NOT built here. This only builds the Android app.
#
# WHY WE INVOKE `gradle` (not `./gradlew`):
#   android/README.md states `gradle-wrapper.jar` is intentionally NOT committed.
#   So `./gradlew` cannot run in CI. We therefore install the matching Gradle
#   distribution (8.9, pinned by gradle-wrapper.properties) in the runner and
#   call `gradle` directly. If you later commit the wrapper jar, switching back
#   to `./gradlew` is a one-line change.
#
# SDK NOTE: compileSdk/targetSdk = 35 (app/build.gradle.kts), so we install
#   platforms;android-35 + build-tools;35.0.0 (NOT android-34).
# ============================================================================

name: Build Android (Cloud)

"on":
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug (and release if signed) APK
    runs-on: ubuntu-latest

    # The Gradle project lives in the android/ subfolder.
    defaults:
      run:
        working-directory: android

    env:
      # Android SDK location (set by android-actions/setup-android@v3).
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      # NOTE: `secrets` context is NOT allowed in step `if:` conditions.
      # So we derive a boolean env var here (jobs CAN read secrets) and gate
      # release/tar steps on it instead.
      HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' && secrets.KEYSTORE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Installs sdkmanager and exports ANDROID_SDK_ROOT / ANDROID_HOME.

      - name: Install SDK packages (platform-tools, build-tools;35.0.0, platforms;android-35)
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Install Gradle 8.9 (wrapper jar is intentionally not committed)
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------------------------------------
      # Lint — non-fatal. Scaffold has not been linted in this environment.
      # ------------------------------------------------------------------
      - name: Lint (Debug)
        run: gradle lintDebug
        continue-on-error: true

      - name: Unit tests (Debug)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK  (cloud compile of the client)
        id: assemble_debug
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ------------------------------------------------------------------
      # RELEASE (guarded). Only runs if all four signing secrets exist.
      # app/build.gradle.kts now defines a signingConfig that reads the four
      # env vars below (when KEYSTORE_PATH is set). Without the secrets this
      # step is skipped; without it, this step is skipped or fails safely.
      # ------------------------------------------------------------------
      - name: Decode upload keystore (Release only)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        run: |
          mkdir -p "${{ github.workspace }}/android/app"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/android/app/release-key.jks"

      - name: Assemble Release APK (Cloud, signed)
        id: assemble_release
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # DISTRIBUTION TAR — package the built APK(s) + metadata into a single
      # tar.gz so the deliverable is one file. This satisfies the "产出 tar
      # 文件（含 apk）" requirement. If release was signed, BOTH apks are
      # included; otherwise the debug apk is always present.
      # ------------------------------------------------------------------
      - name: Package distribution tar (APK + metadata)
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          shopt -s nullglob
          # Debug APK is always produced.
          cp -v app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/dist/" 2>/dev/null || true
          # Release APK only if it was signed & built.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp -v app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/dist/"
          fi
          {
            echo "project=3DCreator"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "ref=${{ github.ref }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=github-actions-ubuntu-latest"
            echo "apks=$(ls "${{ github.workspace }}"/dist/*.apk 2>/dev/null | wc -l | tr -d ' ')"
          } > "${{ github.workspace }}/dist/build-info.txt"
          echo "---- dist contents ----"; ls -la "${{ github.workspace }}/dist"
          tar -czvf "${{ github.workspace }}/3dcreator-android.tar.gz" -C "${{ github.workspace }}/dist" .
          echo "---- tar created ----"; ls -la "${{ github.workspace }}/3dcreator-android.tar.gz"

      - name: Upload distribution tar
        uses: actions/upload-artifact@v4
        with:
          name: 3dcreator-android
          path: 3dcreator-android.tar.gz
          if-no-files-found: error

      # ------------------------------------------------------------------
      # CLOUD DEBUG — surface unit-test results as a downloadable artifact so
      # build/test failures can be inspected without pulling the repo.
      # ------------------------------------------------------------------
      - name: Upload test results (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: app/build/test-results/debug
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "### 3DCreator Cloud Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- debug apk: ${{ steps.assemble_debug.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- release apk: ${{ steps.assemble_release.outcome || 'skipped (no signing secrets)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tar artifact: 3dcreator-android.tar.gz" >> "$GITHUB_STEP_SUMMARY"
