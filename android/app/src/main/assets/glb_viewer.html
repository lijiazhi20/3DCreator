<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3DCreator GLB Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    #c { width: 100%; height: 100%; display: block; }
    #msg { position: fixed; top: 12px; left: 0; right: 0; text-align: center;
           color: #eee; font-family: sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <canvas id="c"></canvas>

  <!-- Three.js r128 (global build, works from file://) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const msg = document.getElementById('msg');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 1000);
    camera.position.set(0, 1, 3);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(3, 5, 2);
    scene.add(dir);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function getParam(name) {
      const m = new URLSearchParams(location.search).get(name);
      return m ? decodeURIComponent(m) : null;
    }

    const modelUrl = getParam('model');
    if (!modelUrl) {
      msg.textContent = 'No model URL provided.';
    } else {
      const loader = new THREE.GLTFLoader();
      loader.load(
        modelUrl,
        (gltf) => {
          const model = gltf.scene;
          // Frame the model.
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3()).length();
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);
          camera.position.set(0, size * 0.3, size * 1.5);
          camera.near = size / 100; camera.far = size * 100;
          camera.updateProjectionMatrix();
          scene.add(model);
          msg.style.display = 'none';
        },
        (xhr) => {
          if (xhr.total) msg.textContent = 'Loading ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
        },
        (err) => { msg.textContent = 'Failed to load model.'; console.error(err); }
      );
    }

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
